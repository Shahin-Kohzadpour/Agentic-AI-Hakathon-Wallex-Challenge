[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallex-challenge-engine"
version = "0.1.0"
description = "Auditable offline research and shadow trading for the Wallex AI challenge"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wallex = "wallex_engine.cli:main"

[tool.setuptools.package-data]
wallex_engine = ["excluded-markets.json"]

[tool.setuptools.packages.find]
where = ["src"]
